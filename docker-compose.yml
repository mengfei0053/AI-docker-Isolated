---
services:
  proxy-gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    image: local/webtop-gateway:latest
    container_name: webtop-gateway
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PROXY_HOST: host.docker.internal
      PROXY_PORT: "10810"
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "1"
      net.ipv6.conf.default.disable_ipv6: "1"
    ports:
      - "3000:3000"
      - "3001:3001"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          ip link show tun0 >/dev/null &&
          curl -fsS --max-time 10 --noproxy '*' https://example.com >/dev/null
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  webtop:
    build:
      context: .
      dockerfile: Dockerfile
    image: local/webtop:us-west
    container_name: ai-docker-isolated
    network_mode: "service:proxy-gateway"
    depends_on:
      proxy-gateway:
        condition: service_healthy
        restart: true
    # Desktop root cannot change network rules or forge marked/raw packets.
    cap_drop:
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/Los_Angeles
      LANG: en_US.UTF-8
      LANGUAGE: en_US:en
      LC_ALL: en_US.UTF-8
      TITLE: Ubuntu Desktop (US-West)
    volumes:
      - ./config:/config
      - ${PROJECTS_DIR:-./workspace}:/projects
      - ./resolv.conf:/etc/resolv.conf:ro
    shm_size: "1gb"
    restart: unless-stopped
